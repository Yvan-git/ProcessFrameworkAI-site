name: Publish the framework site

# The built site is committed to this repository, so publishing it is a
# matter of handing the files to GitHub Pages. The build itself happens in
# the source repository (Yvan-git/ProcessFrameworkAI) and is pushed here by
# .github/workflows/publish-site.yml in that repository.
#
# The committed files are also directly servable: this repository is a
# complete static site, with an .htaccess for Apache, so it can be cloned
# straight into a web root on a shared host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
